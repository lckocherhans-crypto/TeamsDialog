name: Build plugin jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: |
          set +e
          gradle build --console=plain > build.log 2>&1
          echo $? > exitcode
          cat build.log
      - name: Show errors
        if: always()
        run: |
          echo '## Build errors' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E -B1 -A4 "error:|What went wrong|FAILED" build.log | head -80 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Fail if build failed
        run: exit $(cat exitcode)
      - uses: actions/upload-artifact@v4
        with:
          name: TeamsDialog-jar
          path: build/libs/*.jar
